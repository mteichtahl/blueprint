name: CI

# Every job runs on an ephemeral CodeBuild-hosted runner in the BMG AWS account.
# Nothing runs on GitHub-hosted runners (design section 16; enforced by the
# "Workflow policy" job). Fork pull requests never run without approval (16.4).

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Workflow policy
    runs-on: codebuild-bmg-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run policy

  secrets:
    name: Secret scan
    runs-on: codebuild-bmg-ci-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  checks:
    name: CI checks
    runs-on: codebuild-bmg-ci-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # After a release ships, the next PR starts a new one (docs/releases.md).
      # Pull requests only: merges to main and Dependabot PRs deploy under the
      # current version.
      - name: VERSION is newer than the last release
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/release/version-check.mjs
      - name: Lint and format
        run: |
          npm run lint
          npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (incl. CDK assertions and cdk-nag)
        run: npm test
      - name: Build web app
        run: npm run build -w @bmg/web
      - name: Synthesize CDK app (cdk-nag must pass)
        env:
          BMG_REQUIRE_WEB_BUILD: '1'
        run: |
          if [ ! -f bmg.config.json ]; then
            echo "bmg.config.json not committed yet; synthesizing with the example config"
            export BMG_CONFIG=bmg.config.example.json
          fi
          npm run synth
      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high --omit=dev

  codeql:
    name: CodeQL
    # CodeQL ran out of memory on the project's small ARM runner (4 GB) once the
    # codebase grew (rev 11). This job alone runs on a large one (16 GB), with
    # the single-label override <env>-<image>-<size> (same image as the project).
    runs-on: codebuild-bmg-ci-${{ github.run_id }}-${{ github.run_attempt }}-arm-3.0-large
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
