name: CI

# Every job runs on an ephemeral CodeBuild-hosted runner in the BMG AWS account.
# Nothing runs on GitHub-hosted runners (design section 16; enforced by the
# "Workflow policy" job). Fork pull requests never run without approval (16.4).

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Workflow policy
    runs-on: codebuild-bmg-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run policy

  secrets:
    name: Secret scan
    runs-on: codebuild-bmg-ci-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  checks:
    name: CI checks
    runs-on: codebuild-bmg-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint and format
        run: |
          npm run lint
          npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (incl. CDK assertions and cdk-nag)
        run: npm test
      - name: Synthesize CDK app (cdk-nag must pass)
        run: |
          if [ ! -f bmg.config.json ]; then
            echo "bmg.config.json not committed yet; synthesizing with the example config"
            export BMG_CONFIG=bmg.config.example.json
          fi
          npm run synth
      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high --omit=dev

  codeql:
    name: CodeQL
    runs-on: codebuild-bmg-ci-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
