name: Deploy staging

# Every merge to main → checks → staging (bmg-deploy-staging runner). Staging
# is the beta environment and shows beta-X.Y.Z.
#
# Production is a separate workflow (release-prod.yml), started by a vX.Y.Z
# release tag (`blueprint release ship`). The two use different concurrency
# groups, so a release waiting for approval never holds up staging, and
# several merged PRs ship to production together as one release
# (docs/releases.md). AWS credentials come only from each CodeBuild project's
# IAM role; no AWS secret is stored in GitHub (design 16).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One staging deploy at a time, in merge order. Not cancelled midway: a
# half-finished CloudFormation update is worse than a short queue.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read
      security-events: write

  deploy-staging:
    name: Deploy staging
    needs: checks
    runs-on: codebuild-bmg-deploy-staging-${{ github.run_id }}-${{ github.run_attempt }}
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require committed bmg.config.json
        run: |
          test -f bmg.config.json || { echo "::error::Run 'blueprint init' and commit bmg.config.json"; exit 1; }
      - run: npm ci --no-audit --no-fund
      - name: Build web app
        env:
          # Release label in the app's menu footer: beta-X.Y.Z (VERSION file)
          BMG_ENV: staging
          BMG_VERSION: ${{ github.sha }}
        run: npm run build -w @bmg/web
      - name: cdk deploy (staging)
        working-directory: infra
        env:
          BMG_VERSION: ${{ github.sha }}
          BMG_REQUIRE_WEB_BUILD: '1'
        run: npx cdk deploy 'bmg-staging-*' --require-approval never --progress events --outputs-file ../cdk-outputs.json
      - name: Smoke test
        run: |
          deployed=$(node -p "require('./cdk-outputs.json')['bmg-staging-foundation'].DeployedVersion")
          test "$deployed" = "$GITHUB_SHA" || { echo "::error::staging reports $deployed, expected $GITHUB_SHA"; exit 1; }
          release=$(node -p "require('./cdk-outputs.json')['bmg-staging-foundation'].DeployedRelease")
          expected="beta-$(tr -d '[:space:]' < VERSION)"
          test "$release" = "$expected" || { echo "::error::staging release is $release, expected $expected"; exit 1; }
          echo "::notice::staging is on release $release"
          echo "Released **$release** to staging (\`${GITHUB_SHA::7}\`)" >> "$GITHUB_STEP_SUMMARY"
