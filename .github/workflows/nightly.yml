name: Nightly

on:
  schedule:
    - cron: '17 16 * * *' # ~03:17 Melbourne
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Nightly audit
    runs-on: codebuild-bmg-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Workflow policy
        run: npm run policy
      - name: Dependency audit (all severities reported, high fails)
        run: |
          npm audit || true
          npm audit --audit-level=high
      - name: Synthesize (catches cdk-nag regressions from new rule versions)
        run: |
          [ -f bmg.config.json ] || export BMG_CONFIG=bmg.config.example.json
          npm run synth
