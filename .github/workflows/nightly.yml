name: Nightly

on:
  schedule:
    - cron: '17 16 * * *' # ~03:17 Melbourne
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Nightly audit
    runs-on: codebuild-bmg-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Workflow policy
        run: npm run policy
      - name: Dependency audit (all severities reported, high fails)
        run: |
          npm audit || true
          npm audit --audit-level=high
      - name: Synthesize (catches cdk-nag regressions from new rule versions)
        run: |
          [ -f bmg.config.json ] || export BMG_CONFIG=bmg.config.example.json
          npm run synth
