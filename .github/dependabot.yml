version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Melbourne
    open-pull-requests-limit: 5
    groups:
      aws-sdk:
        patterns: ['@aws-sdk/*']
      aws-cdk:
        patterns: ['aws-cdk', 'aws-cdk-lib', 'constructs', 'cdk-nag']
      dev-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Melbourne
